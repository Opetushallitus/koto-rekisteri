name: Build

on:
  push:
    branches:
      - main
  pull_request:

env:
  MISE_ENV: ci

jobs:
  determine_action:
    runs-on: ubuntu-24.04
    outputs:
      action: ${{ github.ref_name == 'main' && 'deploy' || 'diff' }}
    steps:
      - run: echo nothing to see here

  list_changes:
    name: List changes
    runs-on: ubuntu-24.04
    outputs:
      mise: ${{ steps.filter.outputs.mise }}
      infra: ${{ steps.filter.outputs.infra }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        id: filter
        with:
          filters: |
            mise:
              - '.mise.toml'
              - '.mise.*.toml'
            infra:
              - 'infra/**'
            image:
              - 'Dockerfile'
              - '.dockerignore'

  update_tools_cache:
    name: Update tools cache if changed
    runs-on: ubuntu-24.04
    needs: list_changes
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install tools
        if: needs.list_changes.outputs.mise == 'true'
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  submit_dependencies:
    name: Submit dependencies
    runs-on: ubuntu-24.04
    if: github.ref_name == 'main'
    permissions:
      contents: write
    needs: update_tools_cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # GitHub's dependency-graph API returns sporadic HTTP 500s. Retry up to 3
      # times with backoff, then degrade to a warning so a transient outage
      # doesn't fail the workflow run (and trigger a Slack false alarm).
      - name: Update dependency graph (attempt 1/3)
        id: submit1
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        continue-on-error: true
        with:
          directory: server
          ignore-maven-wrapper: "true"
      - name: Back off before retry
        if: steps.submit1.outcome == 'failure'
        run: sleep 30
      - name: Update dependency graph (attempt 2/3)
        id: submit2
        if: steps.submit1.outcome == 'failure'
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        continue-on-error: true
        with:
          directory: server
          ignore-maven-wrapper: "true"
      - name: Back off before final retry
        if: steps.submit2.outcome == 'failure'
        run: sleep 60
      - name: Update dependency graph (attempt 3/3)
        id: submit3
        if: steps.submit2.outcome == 'failure'
        uses: advanced-security/maven-dependency-submission-action@b275d12641ac2d2108b2cbb7598b154ad2f2cee8 # v5.0.0
        continue-on-error: true
        with:
          directory: server
          ignore-maven-wrapper: "true"
      - name: Warn if all attempts failed
        if: steps.submit3.outcome == 'failure'
        run: |
          echo "::warning::Dependency snapshot submission failed after 3 attempts — likely a transient GitHub API issue. Continuing without failing the build."

  server_tests:
    name: Server tests
    runs-on: ubuntu-24.04
    needs: update_tools_cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build with Maven
        run: mvn -B package --file pom.xml
        working-directory: server

  frontend_tests:
    name: Frontend tests
    timeout-minutes: 60
    runs-on: ubuntu-24.04
    needs: update_tools_cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start DB
        run: docker compose up -d db
        working-directory: server
      - name: Install dependencies
        run: npm ci
        working-directory: e2e
      - name: Verify npm registry signatures
        run: npm audit signatures
        working-directory: e2e
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
        working-directory: e2e
      - name: Run Playwright tests
        run: npx playwright test
        working-directory: e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

  lint:
    name: Check code formatting
    runs-on: ubuntu-24.04
    needs: update_tools_cache
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check formatting
        run: ./scripts/check-formatting.sh
      - name: Check workflow security
        run: ./scripts/check-workflows.sh

  build_image:
    name: Build image
    runs-on: ubuntu-24.04
    needs:
      - list_changes
      - server_tests
      - frontend_tests
      - lint
    # Always build on main (the deploy needs the image pushed to ECR).
    # On PRs, only run when Dockerfile/.dockerignore changed — the app code is
    # already verified by server_tests/frontend_tests, so a green check from
    # this job on every PR is mostly wasted CI time.
    if: github.ref_name == 'main' || needs.list_changes.outputs.image == 'true'
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to utility account
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        if: github.ref_name == 'main'
        with:
          aws-region: eu-west-1
          role-to-assume: arn:aws:iam::961341524988:role/kitu-github-actions-role
      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2
        id: login-ecr
        if: github.ref_name == 'main'
      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4
      - uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          push: ${{ github.ref_name == 'main' }}
          tags: ${{
            steps.login-ecr.outputs.registry
            && format('{0}/{1}', steps.login-ecr.outputs.registry, 'kitu')
            || 'kitu'
            }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy_util:
    name: Util
    uses: ./.github/workflows/_deploy-env.yml
    needs:
      - list_changes
      - update_tools_cache
      - determine_action
    if: needs.determine_action.outputs.action == 'deploy' || needs.list_changes.outputs.infra == 'true'
    with:
      environment: Util
      action: ${{ needs.determine_action.outputs.action }}

  deploy_dev:
    name: Dev
    needs:
      - build_image
      - determine_action
      - deploy_util
    uses: ./.github/workflows/_deploy-env.yml
    if: needs.determine_action.outputs.action == 'deploy' || needs.list_changes.outputs.infra == 'true'
    with:
      environment: Dev
      action: ${{ needs.determine_action.outputs.action }}

  deploy_test:
    name: Test
    needs:
      - determine_action
      - deploy_dev
    uses: ./.github/workflows/_deploy-env.yml
    if: needs.determine_action.outputs.action == 'deploy' || needs.list_changes.outputs.infra == 'true'
    with:
      environment: Test
      action: ${{ needs.determine_action.outputs.action }}

  deploy_prod:
    name: Prod
    needs:
      - determine_action
      - deploy_test
    uses: ./.github/workflows/_deploy-env.yml
    if: needs.determine_action.outputs.action == 'deploy' || needs.list_changes.outputs.infra == 'true'
    with:
      environment: Prod
      action: ${{ needs.determine_action.outputs.action }}

  build_docs:
    name: Build documentation page
    runs-on: ubuntu-24.04
    needs:
      - update_tools_cache
      - deploy_prod
    permissions:
      id-token: write
      pages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install tools
        uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4
        with:
          experimental: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build component documentation
        run: |
          mkdir -p docs/uml
          docs/build-uml.sh untuva qa prod
      - name: Verify technical documentation pages exist
        # docs/technical/ on käsinkirjoitettu tekninen dokumentaatio,
        # jonka jekyll-vaihe rendaa automaattisesti. Tämä tarkistus pysäyttää
        # CI:n, mikäli kansio tai jokin odotetuista sivuista on poistettu
        # vahingossa.
        run: |
          test -d docs/technical
          for page in README.md arkkitehtuuri.md koodikonventiot.md integraatiot.md yllapito.md; do
            test -f "docs/technical/$page" || { echo "::error::docs/technical/$page puuttuu"; exit 1; }
          done
      - name: Build html files from markdown files
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./docs/output
      - name: Build database documentation
        run: |
          sudo chmod -R 777 docs/output
          CI=true docs/build.sh
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/output
      - uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
